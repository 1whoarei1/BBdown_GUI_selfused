[package]
name = "bbdown-next"
version = "0.1.0"
description = "A Bilibili downloader with a built-in Rust core"
authors = ["BBDown Next contributors"]
edition = "2021"

[lib]
name = "bbdown_next_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
base64 = "0.22"
encoding_rs = "0.8"
flate2 = "1"
futures-util = "0.3"
md5 = "0.7"
prost = "0.13"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "http2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.0.0", features = ["protocol-asset"] }
thiserror = "2.0"
tokio = { version = "1.40", features = ["process", "rt-multi-thread", "macros", "io-util", "time", "fs", "sync", "net"] }
uuid = { version = "1.10", features = ["v4", "serde"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
