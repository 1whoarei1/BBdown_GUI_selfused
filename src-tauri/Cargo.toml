[package]
name = "bbdown-next"
version = "0.1.0"
description = "A modern desktop GUI for BBDown"
authors = ["BBDown Next contributors"]
edition = "2021"

[lib]
name = "bbdown_next_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
encoding_rs = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.0.0", features = ["protocol-asset"] }
thiserror = "2.0"
tokio = { version = "1.40", features = ["process", "rt-multi-thread", "macros", "io-util", "time"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
